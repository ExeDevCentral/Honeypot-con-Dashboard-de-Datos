input {
  beats {
    port => 5044
  }
}

filter {
  # filebeat manda cada línea JSON en el campo "message" (o ya parseado).
  if [message] {
    json {
      source => "message"
      target => "cowrie"
      skip_on_invalid_json => true
    }
  }

  if [cowrie][timestamp] {
    date {
      match => ["[cowrie][timestamp]", "ISO8601"]
      target => "@timestamp"
    }
  }

  mutate {
    rename => {
      "[cowrie][eventid]" => "event_id"
      "[cowrie][src_ip]"  => "src_ip"
      "[cowrie][username]" => "username"
      "[cowrie][password]" => "password"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "cowrie-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug { metadata => false } }
}

